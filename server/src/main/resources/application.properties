# Connexion PostgreSQL (pgAdmin 4)
# 1. Créer la base "gestion_salles" dans pgAdmin (voir sql/01_create_database.sql)
# 2. Adapter le mot de passe ci-dessous si besoin

spring.application.name=gestion-salles
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_salles
spring.datasource.username=postgres
spring.datasource.password=ladinantsa
spring.datasource.driver-class-name=org.postgresql.Driver

# ORM Hibernate : crée / met à jour les tables à partir des entités Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=TRACE
